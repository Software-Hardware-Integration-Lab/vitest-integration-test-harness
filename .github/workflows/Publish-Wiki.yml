# Display Name of the workflow
name: Publish - Wiki

# Queue wiki updates so only one run can modify the wiki repository at a time.
concurrency:
  group: wiki-publish
  cancel-in-progress: false

# Event listeners for when the job should start execution
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Mirror the documentation whenever the source folder changes on the default branch
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'

# Define each session of execution that should be executed
jobs:
  # Copies the contents of docs/wiki into the repository's GitHub wiki
  Publish-Wiki:
    # Human friendly display name for the job
    name: Publish - Wiki

    # Operating system that the job will run on
    runs-on: ubuntu-slim

    # Set explicit least permission
    permissions:
      contents: write

    steps:
      # Always publish the default-branch source of truth, including manual runs started from another ref.
      - name: Checkout Source Repository
        uses: actions/checkout@v7
        with:
          path: source
          ref: main

      # Queued and manually dispatched runs can have a triggering SHA that differs from the checked-out main revision.
      - name: Record Published Source Revision
        id: source-revision
        working-directory: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The wiki git remote does not exist until the first page is created through the web UI.
      # Fail with an actionable message instead of an opaque git error.
      - name: Confirm the Wiki Has Been Initialized
        env:
          WIKI_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        run: |
          if ! git ls-remote "$WIKI_URL" > /dev/null 2>&1; then
              echo "::error::The wiki for ${{ github.repository }} has no pages yet, so its git remote does not exist."
              echo "::error::Create any page once from the repository's Wiki tab, then re-run this workflow."
              exit 1
          fi

      # Clone the wiki so its history is preserved rather than replaced
      - name: Checkout Wiki Repository
        env:
          WIKI_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        run: git clone "$WIKI_URL" wiki

      # Replace the published pages with the current source of truth
      - name: Synchronize Documentation Into the Wiki
        run: |
          find wiki -maxdepth 1 -name '*.md' -delete
          cp source/docs/wiki/*.md wiki/

      # Publish only when the synchronized content actually differs from what is already live
      - name: Commit and Push Changed Pages
        working-directory: wiki
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add --all

          if git diff --cached --quiet; then
              echo 'Wiki is already up to date; nothing to publish.'
              exit 0
          fi

          git commit -m "docs: sync wiki from ${{ steps.source-revision.outputs.sha }}"
          git push
